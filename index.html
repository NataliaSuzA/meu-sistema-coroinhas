<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Coroinhas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    h1 {
      font-size: 1.85rem;
      color: #1e3a8a;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sistema de Coroinhas</h1>
    <p>Página inicial de teste criada com sucesso e conectada ao repositório no GitHub.</p>
    <span class="badge">Ambiente inicial pronto</span>
  </main>
</body>
</html>
